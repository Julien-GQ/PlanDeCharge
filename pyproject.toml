[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mise-en-forme-charge"
version = "0.1.0"
description = "Utilitaires de mise en forme de valeurs de charge"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Equipe Projet" }
]
dependencies = [
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.0"
]

[project.scripts]
mise-en-forme-charge = "mise_en_forme_charge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
